name: Obol browser smoke

# RETIRED: this suite tested the pre-overhaul architecture. Superseded by ci.yml.
# Triggers reduced to manual-only pending physical removal in the baggage-purge follow-up.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: obol-browser-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The browser proof is split into separate, parallel matrix legs so wall-clock is the
# slowest single check plus setup instead of the sum of every check run back-to-back.
# Only the aggregate `browser-smoke` gate needs to be required in branch protection - it
# turns green only when every matrix leg passed (or skipped). This mirrors the
# full-regression-pr.yml phase-fan-out pattern (see docs/TEST-GOVERNANCE.md); the leg set
# and each check's gating are unchanged, only the topology is parallel.
env:
  SHOULD_FULL_BROWSER: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
  SHOULD_DEEP_EQUIVALENCE: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}

jobs:
  browser-check:
    name: browser-check (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast-route-smoke
            gate: fast
            run: node tests/playwright-route-smoke.js
          - name: note-card-routes
            gate: full
            run: node tests/playwright-note-card-routes.js
          - name: action-first-card-ui
            gate: full
            run: node tests/playwright-action-first-card-ui.js
          - name: tools-library
            gate: full
            run: node tests/playwright-tools-library.js
          - name: credential-auth-surfaces
            gate: full
            run: node tests/playwright-credential-auth-surfaces.js
          - name: tools-full-inventory
            gate: full
            run: node tests/playwright-tools-full-inventory.js
          - name: visual-density
            gate: full
            run: node tests/playwright-visual-density.js
          - name: full-smoke
            gate: full
            run: node tests/playwright-smoke.js
          - name: deep-app-dom-equivalence
            gate: deep
            run: node tools/validate-app-dom-equivalence.js
          - name: deep-style-visual-equivalence
            gate: deep
            run: node tools/validate-style-visual-equivalence.js
          - name: deep-single-paint-boot
            gate: deep
            run: node tools/validate-single-paint-boot-browser.js
          - name: deep-app-semantic-boot
            gate: deep
            run: node tools/validate-app-semantic-boot-browser.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright package
        run: npm install --no-save --no-package-lock playwright@1.62.1

      - name: Resolve system browser
        run: |
          set -euo pipefail
          for browser in /usr/bin/google-chrome-stable /usr/bin/google-chrome /usr/bin/chromium-browser /usr/bin/chromium; do
            if [[ -x "${browser}" ]]; then
              echo "OBOL_SMOKE_BROWSER_PATH=${browser}" >> "${GITHUB_ENV}"
              echo "Using system browser: ${browser}"
              exit 0
            fi
          done
          echo "No system Chrome or Chromium binary found; installing Playwright Chromium."
          npx playwright install --with-deps chromium

      - name: Serve Obol
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/obol-http.log 2>&1 &
          echo $! > /tmp/obol-http.pid
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/index.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/obol-http.log
          exit 1

      - name: Run ${{ matrix.name }}
        if: (matrix.gate == 'full' && env.SHOULD_FULL_BROWSER == 'true') || (matrix.gate == 'deep' && env.SHOULD_DEEP_EQUIVALENCE == 'true') || (matrix.gate == 'fast' && env.SHOULD_FULL_BROWSER != 'true')
        env:
          OBOL_SMOKE_BASE_URL: http://127.0.0.1:4173/index.html
          OBOL_SMOKE_OUTPUT: artifacts/playwright-smoke
        run: ${{ matrix.run }}

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: obol-browser-smoke-${{ github.run_id }}-${{ matrix.name }}
          path: artifacts/playwright-smoke
          if-no-files-found: ignore
          retention-days: 14

  # Single required aggregate gate. It re-runs nothing; it turns green only when every
  # browser-check matrix leg passed (skipped legs, e.g. the fast route smoke on a full
  # run, count as pass). Keep branch protection requiring this job plus
  # full-historical-regression.
  browser-smoke:
    needs: browser-check
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every browser check to pass
        run: |
          set -eu
          result="${{ needs.browser-check.result }}"
          echo "browser-check matrix result: $result"
          case "$result" in
            success|skipped) echo "All browser checks passed." ;;
            *) echo "A browser check did not pass: $result"; exit 1 ;;
          esac
