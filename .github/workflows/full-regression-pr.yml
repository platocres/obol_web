name: Obol PR full regression suite

# RETIRED: historical-contract regression for the pre-overhaul architecture.
# Superseded by ci.yml; manual-only pending physical removal in the baggage-purge follow-up.
on:
  workflow_dispatch:

concurrency:
  group: obol-pr-full-regression-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GITHUB_TOKEN: ${{ github.token }}

# The suite is split into separate, parallel phase jobs so a failure points
# straight at the area that broke (syntax, runtime, cards, notes, ...) instead
# of forcing an agent to re-run one long job one fix at a time. Only the
# aggregate `full-historical-regression` gate (plus browser-smoke) needs to be
# required in branch protection - it turns green only when every phase does.
jobs:
  syntax-all-js:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Syntax-check every JavaScript file
        run: node tools/run-historical-contracts.js --phase syntax

  legacy-core-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Core state, report, and redaction invariants
        run: node tools/run-historical-contracts.js --phase legacy-core

  v5-v8-runtime-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Runtime, boot, equivalence, and style-owner contracts
        run: node tools/run-historical-contracts.js --phase v5-v8-runtime

  v9-early-product-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Card, route, UI, and accessibility contracts
        run: node tools/run-historical-contracts.js --phase v9-early-product

  v9-mid-product-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Notes integration and derivation contracts
        run: node tools/run-historical-contracts.js --phase v9-mid-product

  v9-current-product-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Current release, queue, and version-identity contracts
        run: node tools/run-historical-contracts.js --phase v9-current-product

  quality-preservation-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Governance, release-contract, and single-open-PR guards
        run: node tools/run-historical-contracts.js --phase quality-preservation

  generated-sync-contracts:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generated artifacts are in sync
        run: node tools/run-historical-contracts.js --phase generated-sync

  # Single required aggregate gate. It re-runs nothing; it only passes when
  # every phase above passed, so branch protection can require just this plus
  # browser-smoke while keeping the granular phase rows for diagnosis.
  full-historical-regression:
    needs:
      - syntax-all-js
      - legacy-core-contracts
      - v5-v8-runtime-contracts
      - v9-early-product-contracts
      - v9-mid-product-contracts
      - v9-current-product-contracts
      - quality-preservation-contracts
      - generated-sync-contracts
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every regression phase to pass
        run: |
          set -eu
          results="${{ join(needs.*.result, ' ') }}"
          echo "Phase results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "A regression phase did not pass: $r"; exit 1 ;;
            esac
          done
          echo "All regression phases passed."
