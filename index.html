<!doctype html>
<html lang="en" class="obol-booting" data-obol-boot="loading">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBOL — Offensive Box Operations Ledger</title>
  <meta name="description" content="Evidence-driven OSCP operator companion. A browser-local, static-site edition of the obol engine: proof-gated next-move coach, conservative parsers, BloodHound analysis, checklist, and OSCP reporting. No backend, no execution.">
  <link rel="stylesheet" href="assets/css/obol.css">
  <script>
    /* Pre-paint skin: set before first paint so there is no flash. Tiny + synchronous. */
    (function () {
      try {
        var p = JSON.parse(localStorage.getItem('obol-prefs') || '{}');
        /* Neon (synthwave sunset) is the out-of-the-box skin; a stored choice always wins. */
        document.documentElement.setAttribute('data-skin', (p && p.skin) || 'neon');
        var a = parseFloat(localStorage.getItem('obol.surface-alpha'));
        if (isNaN(a)) a = 0.3; /* default: fade surfaces so the motion background shows through */
        if (a >= 0 && a <= 1) document.documentElement.style.setProperty('--surface-alpha', String(a));
      } catch (e) {}
    })();
    /* Boot guard: if boot never commits, reveal the page anyway so it can't hang hidden. */
    setTimeout(function () {
      if (document.documentElement.getAttribute('data-obol-boot') === 'loading') {
        document.documentElement.classList.remove('obol-booting');
        document.documentElement.setAttribute('data-obol-boot', 'timeout');
      }
    }, 8000);
  </script>
</head>
<body>
  <div id="app">
    <header class="appbar">
      <div class="brand"><svg class="coin" viewBox="0 0 24 24" width="27" height="27" aria-hidden="true">
          <defs><radialGradient id="obolCoin" cx="38%" cy="34%" r="72%">
            <stop offset="0" stop-color="#FFF1A8"/><stop offset="55%" stop-color="#FFD34D"/><stop offset="100%" stop-color="#E6A21C"/>
          </radialGradient></defs>
          <circle cx="12" cy="12" r="10" fill="url(#obolCoin)" stroke="#B9770E" stroke-width="1.5"/>
          <circle cx="12" cy="12" r="7.2" fill="none" stroke="#B9770E" stroke-width="0.8" opacity="0.5"/>
          <path d="M12 7 L16 12 L12 17 L8 12 Z" fill="#B9770E"/>
        </svg>
        <div><h1>OBOL</h1><div class="tagline">Offensive Box Operations Ledger</div></div>
      </div>
      <nav class="mainnav" aria-label="Primary">
        <a data-nav href="#/home">Engagements</a>
        <a data-nav href="#/targets">Targets</a>
        <a data-nav href="#/evidence">Evidence</a>
        <a data-nav href="#/path">Next Steps</a>
        <a data-nav href="#/playbooks">Playbooks</a>
        <a data-nav href="#/tools">Tools</a>
        <a data-nav href="#/map">Map</a>
        <a data-nav href="#/domain">Domain</a>
        <a data-nav href="#/creds">Creds</a>
        <a data-nav href="#/checklist">Checklist</a>
        <a data-nav href="#/findings">Findings</a>
        <a data-nav href="#/scoreboard">Scoreboard</a>
        <a data-nav href="#/report">Report</a>
      </nav>
    </header>

    <aside id="sidebar">
      <div class="side-h">Engagement</div>
      <div class="eng-row">
        <select id="eng-select" aria-label="Active engagement"></select>
        <button id="eng-new" class="btn-mini" title="New engagement">+</button>
      </div>

      <div class="side-h">Parameters</div>
      <div id="params"></div>

      <div class="side-h">Facts</div>
      <ul id="facts-list"></ul>
      <div id="fact-pick" class="fact-pick"></div>
    </aside>

    <main id="view" role="main"><!-- routes render here (once per navigation) --></main>
  </div>

  <!-- Critical path only. Everything else is route-lazy (assets/ui/lazy.js). -->
  <script defer src="assets/engine/facts.js"></script>
  <script defer src="assets/engine/phases.js"></script>
  <script defer src="assets/engine/pack.js"></script>
  <script defer src="assets/engine/profile.js"></script>
  <script defer src="assets/engine/command.js"></script>
  <script defer src="data/packs-bundle.js"></script>
  <script defer src="assets/engine/packs.js"></script>
  <script defer src="assets/ui/util.js"></script>
  <script defer src="assets/ui/factpick.js"></script>
  <script defer src="assets/ui/store.js"></script>
  <script defer src="assets/ui/router.js"></script>
  <script defer src="assets/ui/lazy.js"></script>
  <script defer src="assets/ui/palette.js"></script>
  <script defer src="assets/ui/routes/home.js"></script>
  <script defer src="assets/ui/routes/targets.js"></script>
  <script defer src="assets/ui/routes/evidence.js"></script>
  <script defer src="assets/ui/routes/path.js"></script>
  <script defer src="assets/ui/boot.js"></script>

  <!-- Presentation-only, loaded after the critical path so the boot budget is untouched:
       motion background, coin bursts on genuine proof, and the ⚙ appearance settings. -->
  <script defer src="assets/ui/backdrop.js"></script>
  <script defer src="assets/ui/coin.js"></script>
  <script defer src="assets/ui/settings.js"></script>
</body>
</html>
